<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปิดปรับปรุงระบบชั่วคราว - Marvel Splendor</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
      max-width: 450px;
      width: 100%;
      border: 1px solid rgba(56, 189, 248, 0.3);
      text-align: center;
    }

    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    h1 {
      color: #38bdf8;
      margin-bottom: 1rem;
      font-size: 1.6rem;
      letter-spacing: 1px;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 0.75rem;
      font-size: 0.95rem;
    }

    .status {
      display: inline-block;
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.8rem;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .footer {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 1.5rem;
      border-top: 1px solid #334155;
      padding-top: 1rem;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="icon">🤖</div>
    <div class="status">● MAINTENANCE MODE</div>
    <h1>ระบบปิดปรับปรุงชั่วคราว</h1>
    <p>ระบบเกม Marvel Splendor กำลังอยู่ระหว่างการอัปเดตโครงสร้างระบบและปรับปรุงเซิร์ฟเวอร์</p>
    <p>ขออภัยในความไม่สะดวกครับท่าน</p>
    <div class="footer">J.A.R.V.I.S. Protocol — Systems Offline</div>
  </div>
</body>

</html>

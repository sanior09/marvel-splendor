name: 🐛 Bug Report
description: File a bug report to help us improve Marvel Splendor
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start game in Solo/Multiplayer
        2. Claim card...
        3. See error
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Device & Browser
      options:
        - Chrome / Edge (Desktop)
        - Firefox (Desktop)
        - Safari (macOS / iOS)
        - Mobile Browser (Android)
    validations:
      required: true
